name: Trupanion
kind: company
description: Trupanion is a pet medical insurance provider for cats and dogs, best
  known for its patented software that pays participating veterinary hospitals
  directly at checkout (VetDirectPay) rather than reimbursing pet owners after the
  fact. Trupanion operates a partner developer portal (Azure API Management) that
  exposes Partner APIs for Quotes, Enrollments, and Offers, plus a Vet Portal /
  VetDirectPay integration used by veterinary practice management systems such as
  ezyVet, IDEXX, and DaySmart Vet. API access is gated - partners must be approved
  through Trupanion's Partner Program and are issued OAuth client credentials
  (client ID and client secret) plus a subscription key; the endpoint reference is
  not publicly published. The APIs listed here are modeled from Trupanion's public
  partner and portal materials, not from an openly documented API reference.
